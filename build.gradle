plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id
layout.buildDirectory = file('build-local')

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files

    // These legacy loot resources reference custom loot codecs whose Java
    // registrations are intentionally not part of the Minecraft 26 build yet.
    // Leaving them in the runtime jar makes every integrated-server datapack
    // reload report invalid data. Preserve the source files for the later loot
    // migration, but do not ship broken definitions in this build.
    exclude 'data/kaleidoscope_cookery/loot_table/hoglin.json'
    exclude 'data/kaleidoscope_cookery/loot_table/pig.json'
    exclude 'data/kaleidoscope_cookery/loot_table/piglin.json'
    exclude 'data/kaleidoscope_cookery/loot_table/piglin_brute.json'
    exclude 'data/kaleidoscope_cookery/loot_table/straw_hat_seed_drop.json'
    exclude 'data/kaleidoscope_cookery/loot_table/zoglin.json'
    exclude 'data/kaleidoscope_cookery/loot_table/zombified_piglin.json'
    exclude 'data/kaleidoscope_cookery/loot_table/chest/village_chest.json'
    exclude 'data/neoforge/loot_modifiers/global_loot_modifiers.json'
}

// Optional integrations from the 1.21.1 reference target third-party APIs
// that are not present on the Minecraft 26.1.2 compile classpath. Keep their
// sources in the project, but build the standalone core mod first.
sourceSets.main.java {
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/create/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/emi/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/farmersdelight/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/harvest/**'
    // The Minecraft 26 Jade bridge lives in compat/jade/runtime. Keep the
    // original 1.21 providers as reference sources, but compile the migrated
    // providers against the optional local Jade API below.
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/jade/ModPlugin.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/jade/block/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/ponder/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/rei/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/datagen/**'

    // Minecraft 26 replaced the complete client rendering pipeline with
    // render-state based APIs. Keep the sources for the later visual pass,
    // while compiling the standalone gameplay/core layer first.
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/api/client/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/animation/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/event/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/gui/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/init/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/model/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/render/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/resources/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/tooltip/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/particle/CookingParticle.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/client/particle/StockpotParticle.java'

    // These hooks depend on registries/events that were removed or redesigned
    // in 26.1.2. They are isolated from core cooking gameplay for the first
    // runnable build and remain in source for a follow-up worldgen/loot pass.
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/event/ModTradesEvent.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/event/AddVillageStructuresEvent.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/event/effect/FlatulenceEvent.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/loot/**'
    exclude 'com/github/ysbbbbbb/kaleidoscopecookery/init/ModLootModifier.java'
}

repositories {
    maven {
        // Use a normalized copy: the original extracted repository contains a
        // Log4j artifact that Gradle can read but cannot snapshot on Windows.
        url = uri('../local-maven-clean')
        metadataSources {
            gradleMetadata()
            mavenPom()
            artifact()
        }
    }
    maven {
        // Official KubeJS addon-development repository.
        url = uri('https://maven.latvian.dev/releases')
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
// Local migration workaround: use the installed JDK 26 compiler while still
// emitting Java 25 bytecode. Restore the toolchain to 25 for distribution.
java.toolchain.languageVersion = JavaLanguageVersion.of(26)
java.withSourcesJar()

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.incremental = false
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The sandbox cannot resolve the security configuration of the portable JDK
// 25 used by ModDevGradle's artifact task. Run NFRT and its compiler launcher
// with the configured JDK 26 toolchain; NeoForm still emits the Minecraft 26
// Java 25 target, and this mod's own compiler release remains fixed at 25 above.
def minecraftArtifactJava = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(26)
}.map { launcher -> launcher.executablePath.asFile.absolutePath }
tasks.named('createMinecraftArtifacts').configure {
    javaExecutable.set(minecraftArtifactJava)
    toolsJavaExecutable.set(minecraftArtifactJava)
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    configureEach {
        resolutionStrategy.force 'net.java.dev.jna:jna:5.17.0'
    }
}

dependencies {
    // Local JEI 29 API used by the Minecraft 26.1.2 compatibility layer.
    // The API remains optional at runtime and is not bundled into this mod.
    compileOnly files('libs/jei-26.1.2-neoforge-29.21.0.66.jar')

    // Jade 26.1 API used by the optional in-world recipe information bridge.
    // Jade remains optional and is never bundled into the released jar.
    compileOnly files('libs/jade-mc26.1-neoforge-26.1.8.jar')

    // KubeJS 8 integration for Minecraft 26.1.2. Both dependencies are
    // compile-only: the core mod remains usable when KubeJS is not installed.
    compileOnly('dev.latvian.mods:kubejs-neoforge:26.1.2-8.0.4') {
        transitive = false
    }
    compileOnly('dev.latvian.mods:rhino:2101.2.8-build.91') {
        transitive = false
    }
    localRuntime('dev.latvian.mods:kubejs-neoforge:26.1.2-8.0.4') {
        transitive = false
    }
    localRuntime('dev.latvian.mods:rhino:2101.2.8-build.91') {
        transitive = false
    }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
